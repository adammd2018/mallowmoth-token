name: Deploy MALOTH to Ethereum Mainnet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile contract
        run: npm run compile

      - name: Deploy MALOTH
        env:
          ETHEREUM_MAINNET_PRIVATE_KEY: ${{ secrets.ETHEREUM_MAINNET_PRIVATE_KEY }}
        run: npm run deploy:ethereum
