name: Verify MALOTH on Etherscan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile exact source
        run: npm run compile

      - name: Prepare exact Standard JSON input
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const dir = "artifacts/build-info";
          const file = fs.readdirSync(dir)
            .filter((name) => name.endsWith(".json") && !name.endsWith(".output.json"))[0];

          if (!file) throw new Error("Hardhat build-info not found");

          const buildInfo = JSON.parse(fs.readFileSync(path.join(dir, file), "utf8"));
          if (!buildInfo.input?.sources?.["project/contracts/MallowMoth.sol"]) {
            throw new Error("MallowMoth source missing from compiler input");
          }

          fs.writeFileSync("etherscan-input.json", JSON.stringify(buildInfo.input));
          NODE

      - name: Install official Etherscan CLI
        run: npm install -g @etherscan/cli@latest

      - name: Submit verification
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          test -n "$ETHERSCAN_API_KEY" || { echo "Missing ETHERSCAN_API_KEY secret"; exit 1; }
          etherscan --chain 1 contractverification verify 0xbF5EB14695CD8B6EAC0c9CFE4eb39EB9aD77EaB7             --file etherscan-input.json             --codeformat solidity-standard-json-input             --contractname project/contracts/MallowMoth.sol:MallowMoth             --compilerversion v0.8.38+commit.1835d247
