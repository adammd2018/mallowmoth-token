name: Build Etherscan Verification Input

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile exact deployment source
        run: npm run compile

      - name: Upload raw Hardhat build info
        uses: actions/upload-artifact@v4
        with:
          name: maloth-hardhat-build-info
          path: artifacts/build-info/*.json
          if-no-files-found: error
          retention-days: 30
